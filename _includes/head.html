<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
  integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
  crossorigin="anonymous" />

  <!-- Fontawesome icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Custom stylesheets -->
<link rel="stylesheet" href="{{ '/assets/css/admonitions.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}" />

  <!-- Favicon -->
<link rel="shortcut icon" href="{{ '/files/Logo.png' | relative_url }}" />


{% comment %} <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}" /> {% endcomment %}
<!-- Page title -->
<title>{{ page.title }} - {{ site.short_title }}</title>

<!-- MathJax config -->
<script>
    MathJax = {
      tex: {
        inlineMath: [
          ["$", "$"],
          ["\\(", "\\)"],
        ],
      },
      svg: {
        fontCache: "global",
      },
    };
</script>

<!-- load MathJax -->
<script
  type="text/javascript"
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
